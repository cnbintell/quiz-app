<!DOCTYPE html>
<html lang="my"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Network test</title>
<style>
body{font-family:system-ui,sans-serif;padding:16px;max-width:560px;margin:0 auto}
.r{display:flex;justify-content:space-between;gap:8px;padding:11px 4px;border-bottom:1px solid #ddd;font-size:15px}
.ok{color:#1b9e4b;font-weight:700}.no{color:#d9304f;font-weight:700}.w{color:#888}
button{font:inherit;padding:12px 18px;border:0;border-radius:12px;background:#6a5acd;color:#fff;font-weight:700;margin-top:14px}
</style></head><body>
<h3>🔍 ကွန်ရက် စစ်ဆေးမှု</h3>
<p>VPN ပိတ်ပြီး ဖုန်း data (သို့) Wi-Fi နဲ့ ဖွင့်ပါ။ ✅ = ချိတ်မိ၊ ❌ = ပိတ်ထား/မရ</p>
<div id="o"></div>
<p id="s">⏳ စစ်နေသည်…</p>
<button onclick="run()">🔄 ပြန်စစ်မယ်</button>
<script>
const T=[
["Worker (ကိုယ့်)","https://quiz-proxy.cnbintell.workers.dev/auth/v1/health"],
["Supabase တိုက်ရိုက်","https://fositnokxzztfwtbydro.supabase.co/auth/v1/health"],
["*.workers.dev","https://zz-probe-1.workers.dev/"],
["*.vercel.app","https://zz-probe-1.vercel.app/"],
["*.netlify.app","https://zz-probe-1.netlify.app/"],
["*.pages.dev","https://zz-probe-1.pages.dev/"],
["*.deno.dev","https://zz-probe-1.deno.dev/"],
["*.onrender.com","https://zz-probe-1.onrender.com/"],
["*.web.app (Firebase)","https://zz-probe-1.web.app/"],
["script.google.com","https://script.google.com/"],
["*.github.io","https://cnbintell.github.io/"],
["cdn.jsdelivr.net","https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/package.json"]
];
function row(i,txt,cls){document.getElementById("r"+i).querySelector("b").className=cls;document.getElementById("r"+i).querySelector("b").textContent=txt}
async function one(i,url){const c=new AbortController(),t=setTimeout(()=>c.abort(),9000),t0=performance.now();
try{await fetch(url+(url.includes("?")?"&":"?")+"x="+Date.now(),{mode:"no-cors",cache:"no-store",signal:c.signal});row(i,"✅ "+Math.round(performance.now()-t0)+"ms","ok")}
catch(e){row(i,"❌","no")}finally{clearTimeout(t)}}
async function run(){const o=document.getElementById("o");o.innerHTML=T.map((x,i)=>'<div class="r" id="r'+i+'"><span>'+x[0]+'</span><b class="w">⏳</b></div>').join("");
document.getElementById("s").textContent="⏳ စစ်နေသည်… (၁၀ စက္ကန့်ခန့်)";
await Promise.all(T.map((x,i)=>one(i,x[1])));document.getElementById("s").textContent="✔ ပြီးပါပြီ။ ဒီစာမျက်နှာကို screenshot ရိုက်ပို့ပါ။"}
run();
</script></body></html>
