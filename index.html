<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>

  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <style>
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
    .quiz-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 20px; border-radius: 15px; margin-top: 30px; }
    .btn { background: #ff7eb3; border: none; color: white; padding: 12px 20px; border-radius: 25px; margin: 8px; width: 80%; font-size: 16px; cursor: pointer; transition: 0.2s; }
    .btn:active { transform: scale(0.95); }
    .shake { animation: shake 0.4s; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  </style>
</head>
<body>

  <h1>✨ Daily Knowledge Quiz ✨</h1>

  <div class="quiz-card" id="quizContainer">
    <h2 id="question">မေးခွန်း တင်ပြပါမည်...</h2>
    <div id="options"></div>
  </div>

  <script>
    // အဖြေမှန်ပါက အမှုန်ကျစေသည့် Function
    function onCorrectAnswer() {
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }

    // အဖြေမှားပါက တုန်ခါသွားစေသည့် Function
    function onWrongAnswer() {
      const container = document.getElementById('quizContainer');
      container.classList.add('shake');
      setTimeout(() => container.classList.remove('shake'), 400);
    }
  </script>
</body>
</html>
